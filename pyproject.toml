[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claimsense"
version = "0.1.0"
description = "Health-insurance claim adjudication with auditable money and human approval"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "prometheus-client>=0.20",
    "httpx>=0.27",
]

[project.optional-dependencies]
agents = [
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
    "langchain-openai>=0.2",
    "langchain-mcp-adapters>=0.1",
]
mcp = ["fastmcp>=2.0"]
retrieval = [
    "chromadb>=0.5",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=3.0",
    "pypdf>=4.0",
]
dev = ["pytest>=8.0", "ruff>=0.6", "pypdf>=5.0,<7.0"]  # pypdf: ingestion tests

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["S311", "S404", "S603", "S607", "E501"]  # doc builders shell out to the browser
