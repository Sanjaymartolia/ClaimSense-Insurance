# E4: the signature ablation, who computes the rupees?  Condition A1.
# Everything except `arithmetic` must be identical across E4's configs (config.py checks it).
experiment: E4
condition: A1
architecture: team
arithmetic: llm
description: >-
  The same team, but the model computes every rupee from the same clause choices and the policy rules in words. The calculator still runs alongside, only to measure the model's arithmetic error in rupees.
model_role: coverage          # resolved from config/models.yaml; every role uses this model
tools: [get_policy, claim_history, policy_search, get_clause, tariff_range, calculate]
budget:
  max_tool_calls_per_claim: 40
  max_cost_usd_per_claim: 0.20
data:
  splits: [dev, redteam]
  pass_documents: true
calculator: real
retrieval: stub
varies: [arithmetic]
measure: harness
