# Single source of truth for model IDs and prompt versions. Bump `version` on any change and
# record it in the experiment log. Keep models fixed when comparing designs.
#
# version 2 (13 Nov 2026): agents/llm.py now reads the agent roles from here; until v2 it kept
# its own table and ignored them (AGT-09, docs/MODEL_CARD.md). The roles below name the models
# the agents have actually run since day 1, so no run changes model. One role can be overridden
# for a run with CLAIMSENSE_MODEL_<ROLE>, e.g. CLAIMSENSE_MODEL_COVERAGE.
version: 2

models:
  supervisor: openai/gpt-4.1-mini        # stronger model for supervisor + planner
  extraction: openai/gpt-4.1-mini
  coverage: openai/gpt-4.1-mini
  fraud: openai/gpt-4.1-mini
  critic: openai/gpt-4.1-mini
  settlement: openai/gpt-4.1-mini
  reflector: openai/gpt-4.1               # Reflexion lessons only, never in the claim path
  judge: google/gemini-3.1-flash-lite     # different family from the agents
  guard: meta-llama/llama-guard-4-12b

embeddings: BAAI/bge-small-en-v1.5
reranker: cross-encoder/ms-marco-MiniLM-L-6-v2

temperature:
  default: 0.0
  reflection: 0.3

budgets:
  max_tool_calls_per_claim: 40
  max_cost_usd_per_claim: 0.20

approval:
  senior_threshold_inr: 100000           # assumption — agree with the domain expert

prompts_dir: config/prompts               # one file per agent, six slots: role, context, task,
                                          # constraints, format, examples
