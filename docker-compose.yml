# docker compose up --build  -> everything, in one command: case API, case UI
# (http://127.0.0.1:8501), vector store, Prometheus with the edit-rate alert, and Grafana opening
# on the operations dashboard (http://127.0.0.1:3000). Host ports listen on this machine only.
# The agents run in stub mode (free) unless .env or the shell sets CLAIMSENSE_LLM=real: then
# every claim costs money. Reviewer tokens come from CLAIMSENSE_REVIEWERS
# (src/claimsense/api/README.md); without it, the local demo tokens below apply. Anywhere but
# this machine, set long random tokens instead.
# The MCP servers as their own services over HTTP come later (ADR-0012).
services:
  api:
    build: .
    ports: ["127.0.0.1:8000:8000"]
    env_file:
      - path: .env
        required: false
    environment:
      CHROMA_HOST: chroma
      CLAIMSENSE_LLM: ${CLAIMSENSE_LLM:-stub}
      CLAIMSENSE_REVIEWERS: ${CLAIMSENSE_REVIEWERS:-local-alice=alice:adjudicator,local-bob=bob:senior,local-alice-senior=alice:senior}
      CLAIMSENSE_CHECKPOINTS: /data/checkpoints.sqlite
      CLAIMSENSE_CLAIMS_DB: /data/claims.db
      CLAIMSENSE_AUDIT_LOG: /data/audit.jsonl # the audit trail, kept on the volume (rubric D3)
    volumes: [case-data:/data]
    depends_on: [chroma]

  ui:
    build: { context: ., dockerfile: Dockerfile.ui }
    ports: ["127.0.0.1:8501:8501"]
    environment:
      CLAIMSENSE_API_URL: http://api:8000
    depends_on:
      api: { condition: service_healthy }

  chroma:
    image: chromadb/chroma:0.5.23
    ports: ["127.0.0.1:8001:8000"]
    volumes: [chroma-data:/chroma/chroma]

  prometheus:
    image: prom/prometheus:v2.54.1
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/rules:/etc/prometheus/rules:ro

  grafana:
    image: grafana/grafana:11.2.0
    ports: ["127.0.0.1:3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/claimsense-ops.json
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on: [prometheus]

volumes:
  chroma-data:
  grafana-data:
  case-data:
