# docker compose up  -> API, vector store, Prometheus, Grafana.
# MCP servers (HTTP transport) are added as services in T16–T18.
services:
  api:
    build: .
    ports: ["8000:8000"]
    env_file: [.env]
    environment:
      CHROMA_HOST: chroma
    depends_on: [chroma]

  chroma:
    image: chromadb/chroma:0.5.23
    ports: ["8001:8000"]
    volumes: [chroma-data:/chroma/chroma]

  prometheus:
    image: prom/prometheus:v2.54.1
    ports: ["9090:9090"]
    volumes: [./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro]

  grafana:
    image: grafana/grafana:11.2.0
    ports: ["3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    volumes: [grafana-data:/var/lib/grafana]
    depends_on: [prometheus]

volumes:
  chroma-data:
  grafana-data:
